    <rect x="196" width="164" height="48" rx="24" fill="#e2e8f0" fill-opacity=".06" stroke="#cbd5e1" stroke-opacity=".22"/>
    <text x="278" y="31" fill="#e2e8f0" font-size="16" font-weight="700" letter-spacing="1.5" text-anchor="middle">VERSION 6.0</text>
