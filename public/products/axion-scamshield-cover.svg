<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">Axion ScamShield</title>
<desc id="desc">A dark, modern security-themed cover for the Axion ScamShield ChatGPT decision, verification and recovery toolkit.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#090d17"/>
    <stop offset="0.55" stop-color="#111827"/>
    <stop offset="1" stop-color="#1a1021"/>
  </linearGradient>
  <linearGradient id="shield" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ff6b5f"/>
    <stop offset="1" stop-color="#b82d4d"/>
  </linearGradient>
  <linearGradient id="aura" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ff6b5f" stop-opacity=".28"/>
    <stop offset="1" stop-color="#b82d4d" stop-opacity="0"/>
  </linearGradient>
  <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
    <path d="M44 0H0V44" fill="none" stroke="#a5b4fc" stroke-opacity=".07" stroke-width="1"/>
  </pattern>
  <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="35"/>
  </filter>
</defs>
<rect width="1200" height="800" rx="42" fill="url(#bg)"/>
<rect width="1200" height="800" rx="42" fill="url(#grid)"/>
<circle cx="870" cy="365" r="270" fill="url(#aura)" filter="url(#shadow)"/>
<circle cx="870" cy="365" r="205" fill="none" stroke="#fb7185" stroke-opacity=".15" stroke-width="2"/>
<circle cx="870" cy="365" r="165" fill="none" stroke="#fb7185" stroke-opacity=".16" stroke-dasharray="6 12" stroke-width="2"/>
<g transform="translate(740 202)">
  <path d="M130 0 245 45V142c0 102-66 164-115 189C81 306 15 244 15 142V45Z" fill="#fb7185" fill-opacity=".12" stroke="#ff8a82" stroke-opacity=".35" stroke-width="3"/>
  <path d="M130 20 226 57V143c0 84-52 138-96 164-44-26-96-80-96-164V57Z" fill="url(#shield)"/>
  <path d="M84 147 117 179 178 111" fill="none" stroke="#fff7f5" stroke-linecap="round" stroke-linejoin="round" stroke-width="15"/>
  <path d="M130 44V77" stroke="#fff7f5" stroke-opacity=".8" stroke-width="6" stroke-linecap="round"/>
</g>
<g fill="#fb7185">
  <circle cx="711" cy="205" r="5"/><circle cx="1019" cy="572" r="4"/><circle cx="1083" cy="262" r="4"/><circle cx="739" cy="565" r="5"/>
</g>
<g font-family="Inter,Segoe UI,Arial,sans-serif">
  <text x="96" y="142" fill="#fda4af" font-size="22" font-weight="700" letter-spacing="5">AXION / DIGITAL SAFETY</text>
  <text x="92" y="322" fill="#f8fafc" font-size="82" font-weight="800" letter-spacing="-3">SCAM</text>
  <text x="92" y="410" fill="#fb7185" font-size="82" font-weight="800" letter-spacing="-3">SHIELD</text>
  <text x="98" y="469" fill="#cbd5e1" font-size="24" font-weight="500">DECIDE SAFER. VERIFY SMARTER.</text>
  <text x="98" y="507" fill="#cbd5e1" font-size="24" font-weight="500">RECOVER WITH A PLAN.</text>
