<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
<title id="title">Axion FlowPilot</title>
<desc id="desc">Dark futuristic cover illustrating connected apps, automated workflows, and verified actions.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070d18"/><stop offset="1" stop-color="#12253a"/></linearGradient>
  <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#62f5cd"/><stop offset="1" stop-color="#c3ff66"/></linearGradient>
  <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#62f5cd" stop-opacity=".25"/><stop offset=".5" stop-color="#62f5cd"/><stop offset="1" stop-color="#c3ff66"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="900" rx="38" fill="url(#bg)"/>
<g opacity=".13" stroke="#6edfc9" stroke-width="1"><path d="M0 160H1200M0 240H1200M0 320H1200M0 400H1200M0 480H1200M0 560H1200M0 640H1200M0 720H1200M0 800H1200"/><path d="M100 0V900M200 0V900M300 0V900M400 0V900M500 0V900M600 0V900M700 0V900M800 0V900M900 0V900M1000 0V900M1100 0V900"/></g>
<rect x="76" y="70" width="290" height="48" rx="24" fill="#122b37" stroke="#286b65"/>
<text x="221" y="101" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="4" fill="#83f6d5">AXION WORKFLOW TOOLS</text>
<g font-family="Arial,Helvetica,sans-serif">
  <text x="78" y="265" font-size="88" font-weight="800" fill="#f4f8fb">FLOW</text>
  <text x="78" y="357" font-size="88" font-weight="800" fill="url(#mint)">PILOT</text>
  <text x="84" y="420" font-size="28" fill="#b9c8d8">From repetitive work to connected</text>
  <text x="84" y="460" font-size="28" fill="#b9c8d8">app automations.</text>
  <rect x="80" y="512" width="385" height="68" rx="17" fill="#122c38" stroke="#28645f"/>
  <circle cx="112" cy="546" r="8" fill="#b8ff5a"/>
  <text x="136" y="554" font-size="21" font-weight="600" fill="#e3eef5">Find • Build • Execute • Verify</text>
  <rect x="80" y="599" width="385" height="68" rx="17" fill="#122c38" stroke="#28645f"/>
  <circle cx="112" cy="633" r="8" fill="#62f5cd"/>
  <text x="136" y="641" font-size="21" font-weight="600" fill="#e3eef5">Designed for connected apps</text>
  <text x="80" y="820" font-size="19" letter-spacing="2.1" fill="#71899e">CHATGPT SKILL · COMING SOON</text>
</g>
<g transform="translate(600 155)">
  <path d="M75 160H175M280 160H380M225 210V282" stroke="url(#line)" stroke-width="5" stroke-linecap="round" fill="none" filter="url(#glow)"/>
  <path d="m161 147 15 13-15 13M366 147l15 13-15 13M212 267l13 15 13-15" stroke="#b8ff5a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <rect x="0" y="90" width="150" height="140" rx="25" fill="#102439" stroke="#2a5c6a" stroke-width="2"/>
  <circle cx="75" cy="135" r="25" fill="#163e49" stroke="#62f5cd" stroke-width="2"/>
  <path d="M61 135h28M75 121v28" stroke="#b8ff5a" stroke-width="4" stroke-linecap="round"/>
  <text x="75" y="188" text-anchor="middle" font-size="19" font-weight="700" fill="#e8f5fa">Your goal</text>
  <text x="75" y="211" text-anchor="middle" font-size="14" fill="#9db6c7">Describe it</text>
  <rect x="175" y="90" width="150" height="140" rx="25" fill="#102439" stroke="#2a5c6a" stroke-width="2"/>
  <circle cx="250" cy="135" r="25" fill="#163e49" stroke="#62f5cd" stroke-width="2"/>
  <g fill="none" stroke="#b8ff5a" stroke-width="3"><rect x="239" y="123" width="22" height="24" rx="4"/><path d="M233 129h-5m5 8h-5m38-8h-5m5 8h-5"/></g>
  <text x="250" y="188" text-anchor="middle" font-size="19" font-weight="700" fill="#e8f5fa">Connect</text>
  <text x="250" y="211" text-anchor="middle" font-size="14" fill="#9db6c7">Choose an app</text>
  <rect x="350" y="90" width="150" height="140" rx="25" fill="#102439" stroke="#2a5c6a" stroke-width="2"/>
  <circle cx="425" cy="135" r="25" fill="#163e49" stroke="#62f5cd" stroke-width="2"/>
  <path d="M412 135l9 9 18-20" stroke="#b8ff5a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <text x="425" y="188" text-anchor="middle" font-size="19" font-weight="700" fill="#e8f5fa">Verify</text>
  <text x="425" y="211" text-anchor="middle" font-size="14" fill="#9db6c7">Confirm result</text>
  <rect x="90" y="292" width="320" height="255" rx="30" fill="#0c1a29" stroke="#24525d" stroke-width="2"/>
  <text x="250" y="333" text-anchor="middle" font-size="17" letter-spacing="3" font-weight="700" fill="#83f6d5">WORKFLOW ENGINE</text>
  <rect x="130" y="360" width="240" height="48" rx="13" fill="#142c3b" stroke="#27665f"/>
  <circle cx="153" cy="384" r="6" fill="#62f5cd"/>
  <text x="173" y="391" font-size="17" fill="#e4f1f6">Trigger or request</text>
  <path d="M250 408v18" stroke="#62f5cd" stroke-width="3"/>
  <rect x="130" y="426" width="240" height="48" rx="13" fill="#142c3b" stroke="#27665f"/>
  <circle cx="153" cy="450" r="6" fill="#62f5cd"/>
  <text x="173" y="457" font-size="17" fill="#e4f1f6">Perform action</text>
  <path d="M250 474v18" stroke="#62f5cd" stroke-width="3"/>
  <rect x="130" y="492" width="240" height="36" rx="12" fill="#1a342c" stroke="#5ea76f"/>
  <text x="250" y="516" text-anchor="middle" font-size="16" font-weight="700" fill="#c3ff66">Check that it worked</text>
